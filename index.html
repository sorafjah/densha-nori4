<style>
/* 駅のサイン（紺・白・発車標の橙）をもとにした1テーマのゲーム画面 */
:root{
  --navy:#1b2a4a; --navy2:#2c3f66; --paper:#ffffff; --ink:#1b2a4a; --muted:#5b6b88;
  --led:#ffb020; --ao:#2f6fd6; --midori:#21a05f; --warn:#d8432f; --ok:#1f9d55; --sky:#a9cdea;
  --font:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--font);
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
*{box-sizing:border-box}
button{font-family:var(--font);touch-action:manipulation;cursor:pointer}
rt{font-size:.5em;font-weight:400}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#ver{position:fixed;right:6px;bottom:calc(4px + env(safe-area-inset-bottom,0px));font-size:11px;color:#22324f;opacity:.6;z-index:60;pointer-events:none}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
#hud>#clock,#hud>#banner,#hud>#led{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:min(640px,calc(100vw - 300px));background:rgba(255,255,255,.94);border-radius:14px;border-top:8px solid var(--lc,#2f6fd6);padding:8px 16px 10px;color:var(--navy);pointer-events:none;box-shadow:0 3px 12px rgba(20,30,60,.25)}
#led .big{font-size:28px;font-weight:700;text-align:center;line-height:1.6}
#led .sub{font-size:15px;color:var(--muted);text-align:center}
.route{display:flex;align-items:flex-start;justify-content:space-between;margin-top:6px;position:relative;padding-top:6px}
.route::before{content:"";position:absolute;left:4%;right:4%;top:14px;height:4px;background:var(--lc,#888);border-radius:2px}
.route .st{flex:1;text-align:center;font-size:13px;color:var(--muted);position:relative;line-height:1.5}
.route .st .dot{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--lc,#888);margin:0 auto 4px}
.route .st.now .dot{background:var(--led);border-color:var(--navy);transform:scale(1.25)}
.route .st.now{color:var(--navy);font-weight:700}
.route .st.next .dot{background:var(--lc,#888)}
.route .st.next{color:var(--navy);font-weight:700}
@media (max-width:760px){#led{width:calc(100vw - 32px);bottom:calc(200px + env(safe-area-inset-bottom,0px))}}
#joy{position:absolute;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.8);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 2px 8px rgba(0,0,0,.3)}
#rbtns{position:absolute;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:12px}
#rbtns .row{display:flex;gap:10px}
.sbtn{min-width:76px;height:64px;border:none;border-radius:14px;background:#fff;color:var(--navy);font-size:15px;font-weight:700;box-shadow:0 3px 10px rgba(20,30,60,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 8px;line-height:1.3}
.sbtn svg{width:26px;height:26px}
.sbtn.on{background:var(--led)}
.sbtn.ring{animation:ring .5s infinite alternate;background:#ffe9b0}
@keyframes ring{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
#btnAct{min-width:180px;height:84px;border:none;border-radius:18px;font-size:28px;font-weight:700;color:#fff;background:var(--navy);box-shadow:0 4px 14px rgba(20,30,60,.4)}
#btnAct.board{background:var(--ok)}
#btnAct.alight{background:var(--warn)}
#btnAct.ask{background:var(--navy2)}
#doze{position:fixed;inset:0;background:rgba(8,10,25,.88);z-index:20;display:flex;align-items:center;justify-content:center;color:#cfd8ff;font-size:40px;font-weight:700;pointer-events:none}
#doze[hidden]{display:none}

/* overlays */
.ov{position:fixed;inset:0;z-index:40;background:rgba(15,24,45,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.ov[hidden]{display:none}
.card{background:var(--paper);border-radius:20px;max-width:880px;width:100%;max-height:calc(100% - 8px);overflow:auto;-webkit-overflow-scrolling:touch;box-shadow:0 10px 40px rgba(0,0,0,.35);padding:22px 26px;line-height:1.8}
.card h1{font-size:38px;margin:0;letter-spacing:.04em;text-wrap:balance}
.card h2{font-size:24px;margin:0 0 10px;text-wrap:balance}
.card h3{font-size:18px;margin:14px 0 6px;color:var(--navy2)}
.big-btn{min-height:64px;padding:8px 28px;border:none;border-radius:16px;background:var(--navy);color:#fff;font-size:24px;font-weight:700}
.big-btn.go{background:var(--ok)}
.sub-btn{min-height:52px;padding:6px 18px;border:2px solid var(--navy2);border-radius:14px;background:#fff;color:var(--navy);font-size:18px;font-weight:700}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.titlebar{display:flex;align-items:center;gap:16px;border-bottom:4px solid var(--navy);padding-bottom:10px;margin-bottom:14px}
.titlebar .lines{display:flex;gap:6px}
.titlebar .lines i{width:14px;height:46px;border-radius:4px;display:block}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{border:3px solid #cdd6e6;border-radius:16px;background:#fff;padding:12px;text-align:left;font-size:18px;color:var(--ink);min-height:72px;line-height:1.7}
.choice b{font-size:21px;display:block}
.choice.sel{border-color:var(--navy);background:#eef3ff;box-shadow:inset 0 0 0 2px var(--navy)}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.how{display:flex;gap:10px;align-items:flex-start;background:#f3f6fb;border-radius:12px;padding:10px;font-size:15px;line-height:1.75}
.how svg{flex:0 0 52px;width:52px;height:52px}
@media (max-width:760px){.howto{grid-template-columns:1fr}.choose{grid-template-columns:1fr}}
.plan .leg{display:grid;grid-template-columns:72px 18px 1fr;gap:0 10px;align-items:stretch}
.plan .tm{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;padding-top:2px}
.plan .bar{border-radius:9px;margin:6px 0}
.plan .node{width:18px;height:18px;border-radius:50%;border:4px solid var(--navy);background:#fff;margin-top:8px}
.plan .stn{font-size:22px;font-weight:700}
.plan .ride{font-size:17px;padding:8px 0 14px;color:var(--ink)}
.chip{display:inline-block;padding:0 10px;border-radius:8px;color:#fff;font-weight:700;margin-right:6px}
.trk{display:inline-block;padding:0 10px;border-radius:8px;background:var(--navy);color:#fff;font-weight:700}
.deadline{margin-top:10px;background:#fff6df;border:2px solid var(--led);border-radius:12px;padding:8px 14px;font-size:19px;font-weight:700}
.phone{max-width:640px;border:8px solid #222;border-radius:30px}
.phone .who{font-size:20px;font-weight:700;border-bottom:2px solid #e4e8f0;padding-bottom:8px}
.phone .ask{background:#eef3ff;border-radius:12px;padding:8px 12px;margin:10px 0;font-size:17px}
.prow{margin:10px 0}
.prow .lab{font-size:15px;font-weight:700;color:var(--navy2)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.opt{min-height:48px;padding:4px 14px;border:2px solid #cdd6e6;border-radius:12px;background:#fff;font-size:17px;color:var(--ink);line-height:1.8}
.opt.sel{border-color:var(--navy);background:#dfe8ff;font-weight:700}
.opt.none{color:var(--muted)}
.preview{background:#f7f7f2;border-left:6px solid var(--ok);padding:8px 12px;border-radius:8px;font-size:18px;min-height:52px}
.staffq{display:flex;gap:14px;align-items:flex-start}
.staffq svg{flex:0 0 70px;width:70px;height:70px}
.say{background:#eef3ff;border-radius:14px;padding:10px 14px;font-size:19px;flex:1}
.reslist{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:18px}
.reslist dt{font-weight:700;color:var(--navy2)}
.reslist dd{margin:0;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:10px;margin-top:8px}
.brow{display:grid;grid-template-columns:200px 1fr 64px;align-items:center;gap:10px;font-size:16px}
.btrack{height:26px;background:#eceff5;border-radius:8px;overflow:hidden}
.btrack i{display:block;height:100%;border-radius:8px}
.brow b{font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:640px){.brow{grid-template-columns:1fr 54px}.brow .btrack{grid-column:1/-1;order:3}}
.lesson{margin-top:14px;background:#effaf3;border:2px solid var(--ok);border-radius:12px;padding:10px 14px;font-size:18px}
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:2px;font-size:14px;font-weight:700;color:var(--navy2)}
.field input{font-size:18px;padding:8px 10px;border:2px solid #cdd6e6;border-radius:10px;font-family:var(--font);width:100%;-webkit-user-select:text;user-select:text}
.field .two{display:flex;gap:6px}
.note{font-size:14px;color:var(--muted)}
:focus-visible{outline:3px solid var(--led);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.sbtn.ring{animation:none}.mbar i{transition:none}}
</style>

import * as THREE from 'three';

/* =========================================================
   設定（数値はここだけ直せば変わります）
   ========================================================= */
const CFG = {
  version: 'v2026-10-10c',
  timeScale: 8,          // ゲーム内の秒 ÷ 実時間の秒（8なら 1分が 7.5秒）
  ffScale: 4,            // 「はやおくり」中の倍率
  headway: 5,            // 電車の間隔（分）
  rideMin: 2,            // 駅と駅のあいだ（分）
  dwellMin: 1.2,         // ドアが開いている時間（分）
  approachMin: 0.45, leaveMin: 0.45,   // 電車が入ってくる・出ていく演出（分）
  planWalkMin: 2,        // 案内で見こむ、改札からホームまでの時間（分）
  transferMin: 3,        // 案内で見こむ、乗りかえ時間（分）
  exitMin: 3,            // 到着から「改札を出る」しめきりまでの余裕（分）
  walkSpeed: 6.5,
  // 困り度（1分あたりの増え方）
  rateUnreported: 3.0,                  // トラブル中で、まだ伝えていない
  rateByQuality: [3.0, 1.6, 1.0, 0.6, 0.3], // 伝えた内容の数（0〜4つ）ごと
  latePerMin: 1.0,       // 遅れた1分あたり
  noContactPenalty: 20,  // 一度も連絡しないまま遅れて着いた
  worryAt: [3, 8],       // 相手が心配しはじめる（トラブルから何分）
  callAfterMin: 12,      // 相手から電話がかかってくる
  giveUpMin: 45,         // しめきり後この分数で時間切れ
  delayMin: 12,          // レベル2の電車遅れ（分）
  meterMax: 60,
  lines: {
    ao:     { name: 'あお線',   kana: 'あおせん',   color: '#2f6fd6', stations: ['yamate','moridai','kawabe','chuo','sakura','minato','umibe'] },
    midori: { name: 'みどり線', kana: 'みどりせん', color: '#21a05f', stations: ['higashi','chuo','hoshi','hanazono','kitamori'] },
  },
  stations: {
    yamate:   { name: '山手',     kana: 'やまて' },
    moridai:  { name: 'もりの台', kana: 'もりのだい' },
    kawabe:   { name: 'かわべ',   kana: 'かわべ' },
    chuo:     { name: '中央',     kana: 'ちゅうおう' },
    sakura:   { name: 'さくら町', kana: 'さくらまち' },
    minato:   { name: 'みなと',   kana: 'みなと' },
    umibe:    { name: 'うみべ',   kana: 'うみべ' },
    higashi:  { name: 'ひがし山', kana: 'ひがしやま' },
    hoshi:    { name: 'ほしの丘', kana: 'ほしのおか' },
    hanazono: { name: '花園',     kana: 'はなぞの' },
    kitamori: { name: '北の森',   kana: 'きたのもり' },
  },
  people: {
    school: '○○中学校', player: '',
    teacher: { name: '山田先生', kana: 'やまだせんせい' },
    boss:    { name: '佐藤さん', kana: 'さとうさん' },
  },
  scenes: {
    school: { missions: { 1: { from: 'moridai', to: 'sakura', start: 7*60+41 }, 2: { from: 'moridai', to: 'hoshi', start: 7*60+41 } } },
    work:   { missions: { 1: { from: 'moridai', to: 'minato', start: 8*60+16 }, 2: { from: 'moridai', to: 'hanazono', start: 8*60+16 } } },
  },

function makePlan() {
  const m = G.mission, tL = destLine(), legs = [];
  const add = (L, from, to, tE) => {
    const i = idxOf(from, L), j = idxOf(to, L), dir = Math.sign(j - i), k = firstK(L, dir, i, tE);
    const leg = { L, dir, k, from, to, i, j, plat: arrT(L, dir, k, i, true), dep: depT(L, dir, k, i, true), arr: arrT(L, dir, k, j, true), track: trackNum(from, L, dir), stops: Math.abs(j - i) };
    legs.push(leg); return leg;
  };
  const tE = m.start + CFG.planWalkMin;
  if (idxOf(m.from, tL) >= 0) add(tL, m.from, m.to, tE);
  else { const a = add(linesAt(m.from)[0], m.from, TRANSFER, tE); add(tL, TRANSFER, m.to, a.arr + CFG.transferMin); }
  return { legs, deadline: Math.ceil(legs[legs.length - 1].arr + CFG.exitMin) };
}

function trouble(kind) {

/* --- 動ける場所 --- */
const inR = (r, x, z) => x >= r.x0 && x <= r.x1 && z >= r.z0 && z <= r.z1;
function test(x, z) {
  const P = G.P;
  for (const s of station.stairs) if (inR(s, x, z)) {
    if (P.onStair || (P.level === 'upper' && z < 6.5) || (P.level === 'lower' && z > 17.5)) return { stair: s };
    return null;
  }
  if (P.onStair) {
    if (z < 6.2 && station.upper.some(r => inR(r, x, z))) return { level: 'upper' };
    if (z > 17.8 && station.lower.some(r => inR(r, x, z))) return { level: 'lower' };
    return null;
  }
  return station[P.level].some(r => inR(r, x, z)) ? { level: P.level } : null;
}
function moveTo(nx, nz) {
  const P = G.P, ox = P.x;
  let res = test(nx, nz);
  if (!res) { res = test(nx, P.z); if (res) nz = P.z; else { res = test(P.x, nz); if (res) nx = P.x; else return; } }
  // 改札
  if (P.level === 'upper' && !P.onStair && ((ox >= -8) !== (nx >= -8))) {
    if (nx < -8) {
      if (station.id === G.mission.to) { P.x = nx; P.z = nz; SND.gate(); banner(`{改札|かいさつ}を {出|で}た！`, 'info', 3); finish(false); return; }
      banner(station.id === G.mission.from && G.phase === 'station' ? 'ここは {出発|しゅっぱつ}の {駅|えき}。{電車|でんしゃ}に のろう' : 'ここは おりる {駅|えき}では ありません', 'info', 3); return;
    } else SND.gate();
  }
  P.x = nx; P.z = nz;
  if (res.stair) { P.onStair = true; P.y = stairY(nz); if (nz < 6.1) P.level = 'upper'; else if (nz > 17.9) P.level = 'lower'; }
  else { P.onStair = false; P.level = res.level; P.y = res.level === 'upper' ? 7 : 1; }
}

/* --- 電車の位置（時刻表から決まる） --- */
function updateTrains() {
  for (const tr of station.tracks) {
    const { L, dir, idx } = tr; tr.cur = null;
    const kc = Math.floor((G.t - arrT(L, dir, 0, idx, true)) / CFG.headway);
    for (let k = Math.max(0, kc - 4); k <= kc + 1; k++) {
      const arr = arrT(L, dir, k, idx), dep = arr + CFG.dwellMin;
      if (G.t >= arr - CFG.approachMin && G.t <= dep + CFG.leaveMin) {
        let z = 0;
        if (G.t < arr) { const u = (arr - G.t) / CFG.approachMin; z = -dir * u * u * 170; }
        else if (G.t > dep) { const v = (G.t - dep) / CFG.leaveMin; z = dir * v * v * 170; }
        tr.cur = { k, arr, dep, z, open: G.t >= arr && G.t < dep, terminating: idx === endIdx(L, dir) };
        break;
      }
    }
    tr.train.visible = !!tr.cur;
    if (tr.cur) { tr.train.position.z = tr.cur.z; setDoors(tr.train, tr.cur.open); }
    const op = !!(tr.cur && tr.cur.open);
    if (op && !tr.wasOpen && G.P.level === 'lower' && Math.abs(G.P.x - tr.x) < 8) SND.door();
    tr.wasOpen = op;
  }
}
function nearTrain() {
  const P = G.P; if (P.level !== 'lower' || P.onStair) return null;
  for (const tr of station.tracks) {
    const c = tr.cur; if (!c || !c.open || c.terminating) continue;
    if (Math.sign(P.x - tr.cx) === tr.dir && Math.abs(P.x - tr.cx) > 1.7 && Math.abs(P.z - c.z) < 29) return tr;
  }
  return null;
}
function nearStaff() {
  const P = G.P;
  return station.staff.find(s => s.level === P.level && !P.onStair && Math.hypot(s.obj.position.x - P.x, s.obj.position.z - P.z) < 2.8);
}

function board(tr) {
  const c = tr.cur;
  G.ride = { L: tr.L, dir: tr.dir, k: c.k, i: tr.idx, boardedAt: tr.idx, wrongCounted: false };
  if (G.lastAlight && G.lastAlight.L === tr.L && G.lastAlight.dir === tr.dir && G.lastAlight.k === c.k) G.lastAlight = null;
  G.phase = 'ride'; RIDE.shown = null; SND.door();
  station.group.visible = false; player.visible = false; guideArrow.visible = guideArrow2.visible = false;
}
function alight(forced) {
  const R = G.ride; const s = LN(R.L).stations[R.i];
  const c = correctBoard(s);
  const contOk = !forced && R.i !== R.boardedAt && c && c.line === R.L && c.dir === R.dir && !R.wrongCounted;
  G.lastAlight = contOk ? { L: R.L, dir: R.dir, k: R.k, i: R.i } : null;
  const leg = G.plan.legs[G.legIdx]; if (leg && s === leg.to) G.legIdx++;
  const L = R.L, dir = R.dir; G.ride = null;
  enterStationFromTrain(s, L, dir);
  if (forced) banner('{終点|しゅうてん}です。{電車|でんしゃ}を おりました', 'info', 4);
}
function enterStationFromTrain(s, L, dir) {
  buildStation(s); station.group.visible = true; player.visible = true;
  const tr = station.tracks.find(t => t.L === L && t.dir === dir);
  Object.assign(G.P, { x: tr.cx + dir * 2.3, y: 1, z: -8, level: 'lower', onStair: false, face: dir > 0 ? -Math.PI / 2 : Math.PI / 2, vx: 0, vz: 0, spd: 0 });
  G.cam.yaw = Math.PI / 2; G.phase = 'station'; $('#led').hidden = true;
  updateTrains();
}
function rideDepart(i) {
  const R = G.ride; const s = LN(R.L).stations[i]; const c = correctBoard(s);
  const ok = c && c.line === R.L && c.dir === R.dir;
  if (!ok && !R.wrongCounted) { R.wrongCounted = true; trouble(G.dozing ? 'doze' : (R.boardedAt === i ? 'wrong' : 'pass')); }
}

/* --- 1ステップ --- */
function update(dtReal) {
  G.frames++; G.elapsed += dtReal;
  if (bannerTimer > 0) { bannerTimer -= dtReal; if (bannerTimer <= 0) $('#banner').hidden = true; }
  if (G.phase !== 'station' && G.phase !== 'ride') return;
  if (paused()) return;
  const scale = CFG.timeScale * (G.ff ? CFG.ffScale : 1);
  const dtMin = dtReal * scale / 60;
  G.t += dtMin;
  const dtScale = dtReal * 60;

  // 困り度
  if (G.firstTroubleT != null) G.damage += (G.reportedOk ? CFG.rateByQuality[G.quality] : CFG.rateUnreported) * dtMin;
  // 相手の心配・電話
  if (G.firstTroubleT != null && !G.reportedOk) {
    const el = G.t - G.lastTroubleT;
    if (G.worryStep === 0 && el >= CFG.worryAt[0]) { G.worryStep = 1; banner(`${contactMk()}「まだかな……」`, 'call', 4); }
    if (G.worryStep === 1 && el >= CFG.worryAt[1]) { G.worryStep = 2; banner(`${contactMk()}「{連絡|れんらく}がない。{心配|しんぱい}だな……」`, 'call', 5); }
    if (!G.callShown && el >= CFG.callAfterMin) { G.callShown = true; G.called = true; G.ff = false; SND.ring(); $('#callWho').innerHTML = rb(contactMk()); $('#btnPhone').classList.add('ring'); openOv('ovCall'); }
  }
  // レベル2：電車の遅れ
  if (G.delay && !G.delayAnnounced && G.exitT == null) {
    const atT = G.phase === 'station' && station.id === TRANSFER;
    const onIt = G.ride && G.ride.L === G.delay.L && G.ride.dir === G.delay.dir;
    const atDest = G.phase === 'station' && station.id === G.mission.to;
    if ((G.t >= G.delayTrigger || atT) && !onIt && !atDest) {
      G.delayAnnounced = true; SND.chime();
      trouble('delay');
      banner(`${atT ? 'えきの ほうそう' : 'スマホに {運行|うんこう}{情報|じょうほう}'}：${ln(G.delay.L)}は {信号|しんごう}{点検|てんけん}のため、やく${minTxt(G.delay.min)} おくれています`, 'warn', 8);
    }
  }
  // 予定の電車に乗れたか
  if (G.onPlan) {
    const leg = G.plan.legs[G.legIdx];
    if (leg && G.t > leg.dep + 0.02) {
      const R = G.ride; const onIt = R && R.L === leg.L && R.dir === leg.dir && !R.wrongCounted;
      const atDest = G.phase === 'station' && station.id === G.mission.to;
      if (!onIt && !atDest) trouble('miss');
    }
  }
  // 時間切れ
  if (G.t > G.plan.deadline + CFG.giveUpMin) { finish(true); return; }

  if (G.phase === 'station') {
    // 手前でおりた電車が出ていった
    if (G.lastAlight) { const a = G.lastAlight; if (G.t >= depT(a.L, a.dir, a.k, a.i)) { G.lastAlight = null; trouble('early'); } }
    const P = G.P, { jx, jy } = G.input; const mag = Math.min(1, Math.hypot(jx, jy));
    let tvx = 0, tvz = 0;
    if (mag > 0.08) {
      const y = G.cam.yaw, fx = Math.cos(y), fz = Math.sin(y);
      const vx = fx * jy - fz * jx, vz = fz * jy + fx * jx; const n = Math.hypot(vx, vz) || 1;
      tvx = vx / n * CFG.walkSpeed * mag; tvz = vz / n * CFG.walkSpeed * mag;
    }
    const k = Math.min(1, dtReal * 9);
    P.vx += (tvx - P.vx) * k; P.vz += (tvz - P.vz) * k;
    const spd = Math.hypot(P.vx, P.vz); P.spd = spd;
    if (spd > 0.05) {
      const ox = P.x, oz = P.z;
      moveTo(P.x + P.vx * dtReal, P.z + P.vz * dtReal);
      if (G.phase !== 'station') return;
      if (Math.abs(P.x - ox) < 1e-6) P.vx *= 0.5; if (Math.abs(P.z - oz) < 1e-6) P.vz *= 0.5;
      if (mag > 0.08) { let d = Math.atan2(P.vx, P.vz) - P.face; d = Math.atan2(Math.sin(d), Math.cos(d)); P.face += d * Math.min(1, dtReal * 12); }
    }
    P.walk += spd * dtReal * 2.3;
    updateTrains();
    if (Math.floor(G.t * 2) !== station.lastBoard) { station.lastBoard = Math.floor(G.t * 2); station.boards.forEach(redraw); }
  } else if (G.phase === 'ride') {
    const R = G.ride;
    let guard = 0;
    while (guard++ < 20) {
      const arr = arrT(R.L, R.dir, R.k, R.i), dep = arr + CFG.dwellMin;
      if (R.i === endIdx(R.L, R.dir)) { if (G.t >= arr + 0.15 && !G.dozing) { alight(true); return; } break; }
      if (G.t >= dep) { rideDepart(R.i); R.i += R.dir; continue; }
      break;
    }
    // レベル1：うとうと
    const tI = targetIdx(R.L);
    if (CFG.levelEvent[G.level] === 'doze' && !G.dozeDone && G.troubles.length === 0 && !R.wrongCounted && R.i === tI && R.boardedAt !== R.i && R.dir === Math.sign(tI - R.boardedAt) && G.t >= arrT(R.L, R.dir, R.k, R.i) - 0.5) {
      G.dozeDone = true; G.dozing = true; G.ff = false; $('#doze').hidden = false;
    }
    if (G.dozing && R.i !== tI && G.t >= depT(R.L, R.dir, R.k, tI) + 0.35) {
      G.dozing = false; $('#doze').hidden = true;
      banner(`はっ！ ねてしまった……。{次|つぎ}は ${sn(LN(R.L).stations[R.i])}`, 'warn', 6);
    }
  }
}

/* --- 表示の更新 --- */
let ledKey = '';
function updateRideView(dtReal) {
  const R = G.ride; const L = R.L, st = LN(L).stations;
  const arr = arrT(L, R.dir, R.k, R.i), dep = arr + CFG.dwellMin;
  const prevI = R.i - R.dir; const hasPrev = prevI >= 0 && prevI < st.length && prevI !== undefined && R.i !== R.boardedAt;
  const depPrev = hasPrev ? depT(L, R.dir, R.k, prevI) : -1e9;
  const stopped = G.t >= arr;
  let speed = 0;
  if (!stopped) speed = 38 * Math.max(0.12, Math.min(1, (G.t - depPrev) / 0.35, (arr - G.t) / 0.35));
  RIDE.offset += speed * dtReal * (G.ff ? 2 : 1);
  for (const b of RIDE.outside) b.position.z = ((b.userData.z0 - RIDE.offset) % 300 + 300) % 300 - 150;
  // ホーム
  let pz = null, ps = null;
  if (stopped) { pz = 0; ps = st[R.i]; }
  else if (hasPrev && G.t - depPrev < 0.35) { pz = -Math.pow((G.t - depPrev) / 0.35, 2) * 70; ps = st[prevI]; }
  else if (arr - G.t < 0.35) { pz = Math.pow((arr - G.t) / 0.35, 2) * 70; ps = st[R.i]; }
  const dt = RIDE.door, tg = stopped && !G.dozing ? 1 : 0;
  dt.p = tg > dt.p ? Math.min(1, dt.p + dtReal / 0.8) : Math.max(0, dt.p - dtReal / 0.8);
  const e = dt.p * dt.p * (3 - 2 * dt.p) * 0.75; dt.l.position.z = -0.4 - e; dt.r.position.z = 0.4 + e;
  RIDE.plat.visible = pz != null; if (ps) { RIDE.plat.position.z = pz; setRideSign(ps, L); }
  // 車内表示
  const term = termName(L, R.dir);
  const key = `${R.i}|${stopped}|${G.dozing}`;
  if (key !== ledKey) {
    ledKey = key;
    if (stopped) SND.door();
    const head = stopped ? `${sn(st[R.i])}` : `つぎは　${sn(st[R.i])}`;
    const sub = stopped ? (R.i === endIdx(L, R.dir) ? '{終点|しゅうてん}です' : 'ドアが {開|ひら}いています') : `${ln(L)}　${sn(term)} ゆき`;
    const order = R.dir > 0 ? st : [...st].reverse();
    const route = order.map(s => { const i = st.indexOf(s); const cls = i === R.i ? (stopped ? 'now' : 'next') : ''; return `<div class="st ${cls}"><div class="dot"></div>${rb(sn(s))}</div>`; }).join('');
    $('#led').style.setProperty('--lc', LN(L).color);
    $('#led').innerHTML = `<div class="big">${rb(head)}</div><div class="sub">${rb(sub)}</div><div class="route" style="--lc:${LN(L).color}">${route}</div>`;
  }
  $('#led').hidden = G.dozing;
}
function updateHUD() {
  $('#tNow').textContent = fm(G.t);
  const showDmg = G.damage + (G.exitT == null ? 0 : 0);
  $('#mVal').textContent = Math.round(showDmg);
  const f = $('#mFill'); const pct = Math.min(100, showDmg / CFG.meterMax * 100); f.style.width = pct + '%';
  f.style.background = pct < 30 ? '#1f9d55' : pct < 60 ? '#e6a700' : '#d8432f';
  const rate = $('#mRate');
  let rt, bad = false;
  if (G.firstTroubleT == null) rt = 'いまは ふえていない';
  else if (!G.reportedOk) { rt = 'ふえかた：<b>●●● はやい</b><br>（まだ {連絡|れんらく}していない）'; bad = true; }
  else { const r = CFG.rateByQuality[G.quality]; rt = `ふえかた：${r <= 0.3 ? '● ゆっくり' : r <= 1 ? '●● ふつう' : '●●● はやめ'}（{連絡|れんらく}ずみ）`; }
  const key = rt; if (rate.dataset.k !== key) { rate.dataset.k = key; rate.innerHTML = rb(rt); rate.className = bad ? 'bad' : ''; }
  $('#btnFF').classList.toggle('on', G.ff);
  // ボタン
  const act = $('#btnAct'); let a = null;
  if (G.phase === 'station' && !paused()) {
    const tr = nearTrain(); if (tr) a = ['board', 'のる'];
    else if (nearStaff()) a = ['ask', 'きく'];
  } else if (G.phase === 'ride' && !G.dozing) {
    const R = G.ride; const arr = arrT(R.L, R.dir, R.k, R.i);
    if (G.t >= arr && G.t < arr + CFG.dwellMin && R.i !== endIdx(R.L, R.dir)) a = ['alight', 'おりる'];
  }
  if (a) { if (act.dataset.k !== a[0]) { act.dataset.k = a[0]; act.className = a[0]; act.textContent = a[1]; } act.hidden = false; }
  else { act.hidden = true; act.dataset.k = ''; }
  $('#joy').style.visibility = G.phase === 'station' ? 'visible' : 'hidden';
}
$('#btnAct').onclick = () => doAction();
function doAction() {
  const k = $('#btnAct').dataset.k;
  if (k === 'board') { const tr = nearTrain(); if (tr) board(tr); }
  else if (k === 'ask') consult();
  else if (k === 'alight') alight(false);
}

function updateCamera() {
  const P = G.P;
  const amt = Math.min(1, (P.spd || 0) / CFG.walkSpeed);
  player.position.set(P.x, P.y + Math.abs(Math.sin(P.walk || 0)) * 0.07 * amt, P.z); player.rotation.y = P.face;
  animPerson(player, P.walk || 0, amt);
  const c = G.cam, tx = P.x, ty = P.y + 1.6, tz = P.z;
  const fx = Math.cos(c.yaw), fz = Math.sin(c.yaw);
  let dist = c.dist, h = Math.sin(c.pitch) * dist;
  camera.position.set(tx - fx * Math.cos(c.pitch) * dist, ty + h, tz - fz * Math.cos(c.pitch) * dist);
  camera.lookAt(tx, ty, tz);
  if (G.guide) {
    const b = Math.sin(G.elapsed * 4) * 0.3;
    guideArrow.position.set(G.guide.x, 4.2 + b, G.guide.z);
    guideArrow2.position.set(G.guide.x2, 9.8 + b, 4);
  }
}

/* --- カメラと自分のあいだの物をうすくする --- */
const ray = new THREE.Raycaster(); const faded = new Set(); const fadeCache = new Map();
const _v = new THREE.Vector3();
function fadeOf(m) { let f = fadeCache.get(m.uuid); if (!f) { f = m.clone(); f.transparent = true; f.opacity = 0.2; f.depthWrite = false; f.userData = {}; fadeCache.set(m.uuid, f); } return f; }
function unfadeAll() { for (const o of faded) o.material = o.userData.origMat; faded.clear(); }
function updateOcclusion() {
  unfadeAll();
  if (G.phase !== 'station' || !station) return;
  for (const hy of [0.4, 1.0, 1.8]) {
    _v.set(G.P.x, G.P.y + hy, G.P.z).sub(camera.position); const dist = _v.length();
    ray.set(camera.position, _v.normalize()); ray.far = dist - 0.3;
    for (const h of ray.intersectObjects(station.group.children, true)) {
      const o = h.object; if (!o.isMesh || faded.has(o)) continue;
      o.userData.origMat = o.material;
      o.material = Array.isArray(o.material) ? o.material.map(fadeOf) : fadeOf(o.material);
      faded.add(o);
    }
  }
}

/* --- 入力 --- */
const joy = $('#joy'), knob = $('#knob'); let joyId = null;
function joySet(e) { const r = joy.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); const m = r.width / 2 - 20; const d = Math.hypot(dx, dy); if (d > m) { dx *= m / d; dy *= m / d; } knob.style.transform = `translate(${dx}px,${dy}px)`; G.input.jx = dx / m; G.input.jy = -dy / m; }
joy.addEventListener('pointerdown', e => { joyId = e.pointerId; joy.setPointerCapture(e.pointerId); joySet(e); e.preventDefault(); });
joy.addEventListener('pointermove', e => { if (e.pointerId === joyId) joySet(e); });
const joyEnd = e => { if (e.pointerId !== joyId) return; joyId = null; G.input.jx = G.input.jy = 0; knob.style.transform = ''; };
joy.addEventListener('pointerup', joyEnd); joy.addEventListener('pointercancel', joyEnd);
let dragId = null, dragX = 0, dragY = 0;
renderer.domElement.addEventListener('pointerdown', e => { dragId = e.pointerId; dragX = e.clientX; dragY = e.clientY; });
renderer.domElement.addEventListener('pointermove', e => { if (e.pointerId !== dragId) return; G.cam.yaw += (e.clientX - dragX) * 0.008; G.cam.pitch = Math.max(0.08, Math.min(0.95, G.cam.pitch + (e.clientY - dragY) * 0.004)); dragX = e.clientX; dragY = e.clientY; });
renderer.domElement.addEventListener('pointerup', () => dragId = null);
renderer.domElement.addEventListener('pointercancel', () => dragId = null);
const keys = {};
addEventListener('keydown', e => { keys[e.key] = true; if (e.key === ' ' || e.key === 'Enter') { if (!paused()) doAction(); } });
addEventListener('keyup', e => { keys[e.key] = false; });
function keyInput() { if (joyId != null) return; const x = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0), y = (keys.ArrowUp || keys.w ? 1 : 0) - (keys.ArrowDown || keys.s ? 1 : 0); if (x || y || G.input._k) { G.input.jx = x; G.input.jy = y; G.input._k = !!(x || y); } }

/* iPad：拡大・スクロールを止める */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (!e.target.closest('.scroll')) e.preventDefault(); }, { passive: false });
let lastTouch = 0;
document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouch < 300 && !e.target.closest('input')) e.preventDefault(); lastTouch = now; }, { passive: false });
addEventListener('pointerdown', () => { try { if (AC && AC.state !== 'running') AC.resume(); } catch (e) {} }, { once: false });

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = rideCam.aspect = w / h; camera.updateProjectionMatrix(); rideCam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

/* --- ループ --- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now; dt = Math.min(dt, 1 / 30);
  keyInput();
  update(dt);
  if (G.phase === 'title') { G.cam.yaw += dt * 0.08; G.P.x = -2; G.P.z = 0; G.P.y = 7; player.visible = false; }
  else if (G.phase === 'station') player.visible = true;
  if (G.phase === 'ride' && G.ride) { updateRideView(dt); }
  if (G.phase === 'station' || G.phase === 'ride') updateHUD();
  updateCamera();
  if (station) for (const tr of station.tracks) animDoors(tr.train.userData, dt);
  updateOcclusion();
  renderer.render(G.phase === 'ride' ? rideScene : scene, G.phase === 'ride' ? rideCam : camera);
}

/* =========================================================
   テスト用フック
   エンティティは .position ではなく時刻表（G.t と k, 駅index）で動いています。
   電車の位置は updateTrains() が G.t から毎回計算します。
   ========================================================= */
window.__game = {
  G, CFG, get station() { return station; }, camera, rideCam,
  get frames() { return G.frames; }, get elapsed() { return G.elapsed; },
  api: {
    tick(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) { update(dt); if (G.phase === 'ride' && G.ride) updateRideView(dt); } },
    state: () => ({ phase: G.phase, t: G.t, P: { ...G.P }, ride: G.ride && { ...G.ride }, troubles: G.troubles.slice(), damage: G.damage, reportedOk: G.reportedOk, quality: G.quality, exitT: G.exitT, result: G.result, modals: [...G.modals] }),
    start(sceneKey = 'school', level = 1) { G.sceneKey = sceneKey; G.level = level; closeOv('ovStart'); startMission(); closeOv('ovPlan'); },
    joy(x, y) { G.input.jx = x; G.input.jy = y; },
    teleport(x, z, level = 'lower') { Object.assign(G.P, { x, z, level, onStair: false, y: level === 'upper' ? 7 : 1 }); },
    action: doAction, board: () => { const tr = nearTrain(); if (tr) board(tr); return !!tr; }, alight: () => alight(false),
    report(q = 4) { const items = ['name', 'where', 'late', 'plan'].map((k, i) => ({ key: k, ok: i < q, n: 10 })); report(items, false); closeOv('ovReply'); },
    closeAll() { [...G.modals].forEach(closeOv); },
    nearTrain, plan: () => G.plan,
  },
};

/* --- 起動 --- */
(async () => {
  try { await Promise.race([document.fonts.load(`700 40px "BIZ UDPGothic"`), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  G.modals.add('ovStart');
  buildStation('moridai');
  requestAnimationFrame(frame);
})();
</script>
